#-----------------------------------------------------------
# Redis Config
#-----------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-external-config
  namespace: nextcloud
data:
  redis-additional.conf: |
    tcp-keepalive 300
    maxmemory 5120mb
    maxmemory-policy allkeys-lru
    save ""
    protected-mode yes
    slowlog-max-len 256
    slowlog-log-slower-than 1000
    stream-node-max-bytes 4096
    databases 1
    io-threads-do-reads yes
    io-threads 2
    appendonly yes
    appendfsync no

---
#-----------------------------------------------------------
# Redis Replication
#-----------------------------------------------------------
apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: RedisReplication
metadata:
  name: redis-replication
  namespace: nextcloud
spec:
  clusterSize: 3
  redisConfig:
    additionalRedisConfig: redis-external-config
  kubernetesConfig:
    image: quay.io/opstree/redis:v7.0.15
    imagePullPolicy: IfNotPresent

    redisSecret:
      name: password-nextcloud
      key: redis_password

    resources:
      requests:
        cpu: "1" # <--- ¡CAMBIA ESTO A TU NECESIDAD!
        memory: "6Gi" # <--- ¡CAMBIA ESTO A TU NECESIDAD!
      limits:
        cpu: "4" # <--- ¡CAMBIA ESTO A TU NECESIDAD!
        memory: "6Gi" # <--- ¡CAMBIA ESTO A TU NECESIDAD!

  storage:
    volumeClaimTemplate:
      spec:
        storageClassName: longhorn # <--- ¡CAMBIA ESTO A TU NECESIDAD!
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi # <--- ¡CAMBIA ESTO A TU NECESIDAD!

  redisExporter:
    enabled: false
    image: quay.io/opstree/redis-exporter:v1.44.0
    imagePullPolicy: Always

  podSecurityContext:
    runAsUser: 1000
    fsGroup: 1000

  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - redis-replication
          topologyKey: "kubernetes.io/hostname"

